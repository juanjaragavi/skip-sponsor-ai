name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Manual re-runs: gh workflow run ci-main.yml -R juanjaragavi/skip-sponsor-ai
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build:api
      # Production builds need an https API origin; this placeholder only
      # proves the build. Store builds set the real one (docs/DEPLOY.md).
      - run: npm run build:extension
        env:
          VITE_API_BASE_URL: https://api.ci.invalid
