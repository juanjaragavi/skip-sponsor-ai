version: "3.9"
services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: skipsponsor
      POSTGRES_PASSWORD: skipsponsor
      POSTGRES_DB: skipsponsor
    ports: ["5434:5432"] # host 5434: 5432 is left to other local Postgres instances
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7.2
    ports: ["6380:6379"] # host 6380: 6379 is left to other local Redis instances
volumes:
  pgdata: {}
