version: "3.9"
services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: skipsponsor
      POSTGRES_PASSWORD: skipsponsor
      POSTGRES_DB: skipsponsor
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7.2
    ports: ["6379:6379"]
volumes:
  pgdata: {}
