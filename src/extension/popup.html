<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        font: 14px system-ui;
        padding: 12px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <h3>SkipSponsor AI</h3>
    <label><input type="checkbox" id="enabled" /> Enabled</label>
    <label
      >Mode
      <select id="mode">
        <option value="auto">auto</option>
        <option value="notify">notify</option>
        <option value="off">off</option>
      </select></label
    >
    <label
      >Confidence
      <input type="number" id="thr" min="0.5" max="0.95" step="0.01"
    /></label>
    <button id="save">Save</button>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
