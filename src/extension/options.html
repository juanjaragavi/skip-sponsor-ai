<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkipSponsor AI</title>
  </head>
  <body>
    <div class="options">
      <aside class="sidebar">
        <div class="sidebar__inner">
          <div class="brand">
            <span id="mark" class="mark"></span
            ><span class="app">SkipSponsor AI</span>
          </div>
          <nav class="nav" data-i18n-aria-label="optionsNavLabel">
            <a
              class="nav__item"
              href="#general"
              data-icon="sliders-horizontal"
              data-size="18"
              data-i18n="navGeneral"
            ></a>
            <a
              class="nav__item"
              href="#channels"
              data-icon="tv"
              data-size="18"
              data-i18n="navChannels"
            ></a>
            <a
              class="nav__item"
              href="#privacy"
              data-icon="shield-check"
              data-size="18"
              data-i18n="navPrivacy"
            ></a>
            <a
              class="nav__item"
              href="#about"
              data-icon="info"
              data-size="18"
              data-i18n="navAbout"
            ></a>
          </nav>
        </div>
      </aside>

      <main class="content">
        <section id="general" class="section" aria-labelledby="general-title">
          <header class="head">
            <h1 id="general-title" class="title" data-i18n="navGeneral"></h1>
            <p class="desc" data-i18n="generalDesc"></p>
          </header>
          <div class="card">
            <div class="card__row card__row--split">
              <div class="stack">
                <span
                  id="enable-label"
                  class="row-label"
                  data-i18n="skipSponsorReads"
                ></span>
                <span class="hint" data-i18n="generalEnableHint"></span>
              </div>
              <button
                id="enabled"
                class="switch"
                type="button"
                role="switch"
                aria-checked="true"
                aria-labelledby="enable-label"
              >
                <span class="switch__track"
                  ><span class="switch__knob"></span
                ></span>
              </button>
            </div>
            <div class="card__row">
              <span
                id="mode-label"
                class="row-label"
                data-i18n="modeLabel"
              ></span>
              <div class="modes" role="radiogroup" aria-labelledby="mode-label">
                <button
                  class="mode-card"
                  type="button"
                  role="radio"
                  data-mode="auto"
                >
                  <span
                    class="mode-card__top"
                    data-icon="fast-forward"
                    data-size="18"
                    ><span class="mode-card__title" data-i18n="modeAuto"></span
                  ></span>
                  <span class="mode-card__desc" data-i18n="modeAutoDesc"></span>
                </button>
                <button
                  class="mode-card"
                  type="button"
                  role="radio"
                  data-mode="notify"
                >
                  <span class="mode-card__top" data-icon="bell" data-size="18"
                    ><span
                      class="mode-card__title"
                      data-i18n="modeNotify"
                    ></span
                  ></span>
                  <span
                    class="mode-card__desc"
                    data-i18n="modeNotifyDesc"
                  ></span>
                </button>
                <button
                  class="mode-card"
                  type="button"
                  role="radio"
                  data-mode="off"
                >
                  <span
                    class="mode-card__top"
                    data-icon="circle-off"
                    data-size="18"
                    ><span class="mode-card__title" data-i18n="modeOff"></span
                  ></span>
                  <span class="mode-card__desc" data-i18n="modeOffDesc"></span>
                </button>
              </div>
            </div>
            <div class="card__row card__row--last">
              <div class="row-between">
                <label
                  for="threshold"
                  class="row-label"
                  data-i18n="confidenceThreshold"
                ></label>
                <span id="thr-value" class="badge tabular">78%</span>
              </div>
              <input
                id="threshold"
                class="slider"
                type="range"
                min="50"
                max="95"
                step="1"
              />
              <div class="row-between scale">
                <span data-i18n="thresholdScaleLow"></span
                ><span data-i18n="thresholdScaleHigh"></span>
              </div>
              <p id="thr-hint" class="hint"></p>
            </div>
          </div>
        </section>

        <section
          id="channels"
          class="section"
          aria-labelledby="channels-title"
          hidden
        >
          <header class="head">
            <h1 id="channels-title" class="title" data-i18n="navChannels"></h1>
            <p class="desc" data-i18n="channelsDesc"></p>
          </header>
          <form id="channel-form" class="card card__row add-channel" novalidate>
            <label
              for="channel-input"
              class="row-label"
              data-i18n="channelsAdd"
            ></label>
            <div class="add-channel__row">
              <input
                id="channel-input"
                class="input"
                type="text"
                data-i18n-placeholder="channelsPlaceholder"
                autocomplete="off"
                spellcheck="false"
                aria-describedby="channel-hint"
              />
              <button
                class="button"
                type="submit"
                data-icon="plus"
                data-size="15"
                data-i18n="channelsAddButton"
              ></button>
            </div>
            <p
              id="channel-hint"
              class="hint"
              aria-live="polite"
              data-i18n="optionsChannelHint"
            ></p>
          </form>
          <div
            id="channel-list"
            class="card"
            role="list"
            data-i18n-aria-label="channelsListLabel"
            hidden
          ></div>
          <div id="channel-empty" class="empty">
            <span class="empty__icon" data-icon="check" data-size="20"></span>
            <span class="empty__title" data-i18n="channelsEmptyTitle"></span>
            <span class="hint" data-i18n="channelsEmptyHint"></span>
          </div>
        </section>

        <section
          id="privacy"
          class="section"
          aria-labelledby="privacy-title"
          hidden
        >
          <header class="head">
            <h1 id="privacy-title" class="title" data-i18n="navPrivacy"></h1>
            <p class="desc" data-i18n="privacyDesc"></p>
          </header>
          <div class="grid">
            <article class="info-card">
              <span
                class="info-card__icon"
                data-icon="captions"
                data-size="18"
              ></span>
              <h2
                class="info-card__title"
                data-i18n="privacyCaptionsTitle"
              ></h2>
              <p class="hint" data-i18n="privacyCaptionsHint"></p>
            </article>
            <article class="info-card">
              <span
                class="info-card__icon"
                data-icon="user-x"
                data-size="18"
              ></span>
              <h2 class="info-card__title" data-i18n="privacyAccountTitle"></h2>
              <p class="hint" data-i18n="privacyAccountHint"></p>
            </article>
            <article class="info-card">
              <span
                class="info-card__icon"
                data-icon="timer-reset"
                data-size="18"
              ></span>
              <h2 class="info-card__title" data-i18n="privacyCacheTitle"></h2>
              <p class="hint" data-i18n="privacyCacheHint"></p>
            </article>
            <article class="info-card">
              <span
                class="info-card__icon"
                data-icon="users"
                data-size="18"
              ></span>
              <h2
                class="info-card__title"
                data-i18n="privacyNoCaptionsTitle"
              ></h2>
              <p class="hint" data-i18n="privacyNoCaptionsHint"></p>
            </article>
          </div>
          <h2 class="subtitle" data-i18n="privacyYourData"></h2>
          <div class="card">
            <div class="card__row card__row--split">
              <div class="stack">
                <span
                  id="telemetry-label"
                  class="row-label"
                  data-i18n="privacyShareUsage"
                ></span>
                <span class="hint" data-i18n="privacyShareUsageHint"></span>
              </div>
              <button
                id="telemetry"
                class="switch"
                type="button"
                role="switch"
                aria-checked="true"
                aria-labelledby="telemetry-label"
              >
                <span class="switch__track"
                  ><span class="switch__knob"></span
                ></span>
              </button>
            </div>
            <div class="card__row card__row--split">
              <div class="stack">
                <span class="row-label" data-i18n="privacyResetTitle"></span>
                <span class="hint" data-i18n="privacyResetHint"></span>
              </div>
              <button
                id="reset"
                class="button button--danger"
                type="button"
                data-icon="timer-reset"
                data-size="15"
                data-i18n="optionsReset"
              ></button>
            </div>
            <div class="card__row">
              <div class="stack">
                <span
                  class="row-label"
                  data-i18n="privacyWhoResponsible"
                ></span>
                <span id="privacy-controller" class="hint"></span>
              </div>
            </div>
            <div class="card__row card__row--split card__row--last">
              <div class="stack">
                <span class="row-label" data-i18n="privacyFullPolicy"></span>
                <span class="hint" data-i18n="privacyFullPolicyHint"></span>
              </div>
              <a
                class="link"
                href="https://juanjaragavi.github.io/skip-sponsor-ai/privacy/"
                target="_blank"
                rel="noopener"
                data-icon="file-text"
                data-size="15"
                data-i18n="privacyReadPolicy"
                data-i18n-href="privacyPolicyUrl"
              ></a>
            </div>
          </div>
        </section>

        <section
          id="about"
          class="section"
          aria-labelledby="about-title"
          hidden
        >
          <header class="head">
            <h1 id="about-title" class="title" data-i18n="navAbout"></h1>
            <p class="desc" data-i18n="aboutDesc"></p>
          </header>
          <div class="card">
            <div class="card__row card__row--split">
              <div class="about__version">
                <span id="about-mark"></span>
                <div class="stack">
                  <span id="version" class="row-label"></span>
                  <span class="hint" data-i18n="aboutChromeRequirement"></span>
                  <span id="about-copyright" class="hint"></span>
                </div>
              </div>
              <div class="links">
                <a
                  class="link"
                  href="https://github.com/juanjaragavi/skip-sponsor-ai/issues"
                  target="_blank"
                  rel="noopener"
                  data-icon="life-buoy"
                  data-size="15"
                  data-i18n="aboutSupport"
                ></a>
                <a
                  class="link"
                  href="https://juanjaragavi.github.io/skip-sponsor-ai/privacy/"
                  target="_blank"
                  rel="noopener"
                  data-icon="file-text"
                  data-size="15"
                  data-i18n="aboutPrivacyPolicy"
                  data-i18n-href="privacyPolicyUrl"
                ></a>
                <a
                  class="link"
                  href="https://juanjaragavi.github.io/skip-sponsor-ai/terms/"
                  target="_blank"
                  rel="noopener"
                  data-icon="file-text"
                  data-size="15"
                  data-i18n="aboutTerms"
                  data-i18n-href="termsUrl"
                ></a>
                <a
                  class="link"
                  href="https://github.com/juanjaragavi/skip-sponsor-ai"
                  target="_blank"
                  rel="noopener"
                  data-icon="code-xml"
                  data-size="15"
                  data-i18n="aboutSourceCode"
                ></a>
              </div>
            </div>
            <div class="card__row card__row--split card__row--last">
              <div class="stack">
                <span
                  class="row-label"
                  data-i18n="aboutDetectionService"
                ></span>
                <span
                  id="service-host"
                  class="hint"
                  data-i18n="optionsStatusChecking"
                ></span>
              </div>
              <div class="service">
                <span
                  id="service-status"
                  class="status"
                  data-state="checking"
                  data-i18n="optionsStatusChecking"
                ></span>
                <button
                  id="service-retry"
                  class="button button--ghost"
                  type="button"
                  data-i18n="aboutCheckAgain"
                ></button>
              </div>
            </div>
          </div>
          <a
            class="link report"
            href="https://github.com/juanjaragavi/skip-sponsor-ai/issues/new?title=Wrong%20skip%3A%20&amp;body=Video%20link%3A%0AWhat%20was%20skipped%20(or%20missed)%3A%0A"
            target="_blank"
            rel="noopener"
            data-icon="life-buoy"
            data-size="15"
            data-i18n="aboutReportSkip"
          ></a>
        </section>
      </main>
    </div>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
